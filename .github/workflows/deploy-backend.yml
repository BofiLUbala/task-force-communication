# API Django -> instance EC2, via AWS Systems Manager.
#
# Architecture reelle (voir docs/DEPLOYMENT.md) :
#   Cloudflare Workers (site) -> tunnel cloudflared -> EC2 (gunicorn + PostgreSQL)
#
# Le deploiement ne pousse pas d'image : l'instance tire le code depuis Git et
# redemarre son service. Pas de Docker, pas de registre, comme les autres
# projets de l'equipe.
#
# Deux jobs volontairement separes :
#
#   check   se declenche a chaque push. Il ne touche pas a AWS, donc il passe
#           toujours au vert et signale une migration oubliee ou un settings
#           casse avant qu'ils n'arrivent sur le serveur.
#
#   deploy  est MANUEL (Actions > Deploy backend > Run workflow). Tant que le
#           role OIDC n'existe pas, un declenchement automatique ne ferait
#           qu'echouer a chaque push sans rien apprendre a personne.
#
# Secrets requis par `deploy` uniquement :
#   AWS_ROLE_ARN     role IAM assume par GitHub via OIDC (procedure : docs/CI-CD.md)
#   EC2_INSTANCE_ID  ex. i-06ac961922a60190a
# Variable :
#   AWS_REGION       defaut eu-west-3 (Paris)

name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dependances
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verifications Django
        working-directory: backend
        env:
          DEBUG: 'True'
          SECRET_KEY: ci-only
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

  deploy:
    # Manuel tant que AWS_ROLE_ARN et EC2_INSTANCE_ID ne sont pas configures.
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-3' }}
    steps:
      - name: Identifiants AWS temporaires (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # SSM execute les commandes sur l'instance sans ouvrir le moindre port :
      # c'est le meme canal que la console Session Manager.
      - name: Deployer sur l'instance
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${INSTANCE_ID:-}" ]; then
            echo "::error::Le secret EC2_INSTANCE_ID est absent."
            exit 1
          fi

          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploiement Task Force ${GITHUB_SHA::7}" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/taskforce",
              "git fetch --all --prune",
              "git reset --hard origin/main",
              "cd backend",
              "venv/bin/pip install -r requirements.txt -q",
              "venv/bin/python manage.py migrate --noinput",
              "venv/bin/python manage.py collectstatic --noinput",
              "systemctl restart taskforce",
              "sleep 5",
              "curl -fsS http://127.0.0.1:8000/healthz/"
            ]' \
            --query Command.CommandId --output text)

          echo "Commande SSM $CMD envoyee, attente du resultat..."
          aws ssm wait command-executed \
            --command-id "$CMD" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          echo "--- sortie ---"
          aws ssm get-command-invocation \
            --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploiement en echec ($STATUS)"
            aws ssm get-command-invocation \
              --command-id "$CMD" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi
          echo "Deploiement termine : le service repond sur /healthz/."
