# API Django -> image Docker sur GHCR, puis redeploiement de l'hebergeur.
#
# L'image construite ici (backend/Dockerfile) est celle decrite dans
# docs/DEPLOYMENT.md : elle tourne telle quelle sur App Runner, ECS, Render,
# Koyeb ou un VPS. Le workflow ne suppose donc aucun hebergeur precis :
# il publie l'image, puis appelle un webhook de deploiement si le secret existe.
#
# Secret optionnel :
#   DEPLOY_HOOK_URL  URL de redeploiement fournie par l'hebergeur
#                    (Render : "Deploy hook" ; Koyeb / App Runner : webhook
#                    ou auto-deploy sur nouvelle image, auquel cas ce secret
#                    reste vide et rien n'est appele).
# GITHUB_TOKEN suffit pour pousser sur ghcr.io : aucun secret a creer.

name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dependances
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verifications Django
        working-directory: backend
        env:
          DEBUG: 'True'
          SECRET_KEY: ci-only
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # Le tag SHA permet de revenir a une version precise ; latest est ce
          # que l'hebergeur tire au redeploiement.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Declencher le redeploiement
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Aucun DEPLOY_HOOK_URL : l'image est publiee, le redeploiement reste manuel."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
