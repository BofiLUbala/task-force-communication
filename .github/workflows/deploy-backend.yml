# API Django -> Amazon ECR, puis redeploiement App Runner.
#
# Architecture decrite dans docs/DEPLOYMENT.md :
#   GitHub Actions -> ECR -> App Runner -> RDS PostgreSQL (+ S3 pour les medias)
#
# L'authentification passe par OIDC : GitHub obtient des identifiants AWS
# temporaires en assumant un role. Aucune cle d'acces longue duree n'est
# stockee dans le depot (procedure de creation du role : docs/CI-CD.md).
#
# Secrets requis :
#   AWS_ROLE_ARN             arn:aws:iam::<compte>:role/github-actions-taskforce
# Secret optionnel :
#   APPRUNNER_SERVICE_ARN    ARN du service App Runner. Absent, ou si le
#                            service est en auto-deploiement, l'image est
#                            simplement poussee sur ECR.
# Variables (Settings > Variables) :
#   AWS_REGION               defaut eu-west-3 (Paris)
#   ECR_REPOSITORY           defaut taskforce-backend

name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dependances
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verifications Django
        working-directory: backend
        env:
          DEBUG: 'True'
          SECRET_KEY: ci-only
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      # Requis par OIDC pour reclamer le jeton d'identite GitHub.
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-3' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'taskforce-backend' }}
    steps:
      - uses: actions/checkout@v4

      - name: Identifiants AWS temporaires (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connexion a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # Le tag SHA permet de revenir a une version precise ; latest est ce
          # que tire App Runner au redeploiement.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # App Runner en auto-deploiement reagit tout seul au nouveau tag latest.
      # Sinon ce declenchement explicite lance le deploiement et attend qu'il
      # se termine, pour que le job echoue si le service ne demarre pas.
      - name: Redeployer App Runner
        env:
          SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
        run: |
          if [ -z "$SERVICE_ARN" ]; then
            echo "Aucun APPRUNNER_SERVICE_ARN : image poussee sur ECR, redeploiement non declenche."
            exit 0
          fi
          OPERATION=$(aws apprunner start-deployment \
            --service-arn "$SERVICE_ARN" \
            --query OperationId --output text)
          echo "Deploiement $OPERATION en cours..."
          for _ in $(seq 1 60); do
            STATUS=$(aws apprunner describe-service \
              --service-arn "$SERVICE_ARN" \
              --query Service.Status --output text)
            case "$STATUS" in
              RUNNING) echo "Service RUNNING."; exit 0 ;;
              CREATE_FAILED|DELETE_FAILED) echo "::error::Service en echec ($STATUS)"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Le service n'est pas repasse en RUNNING apres 20 minutes."
          exit 1
