# Blueprint Render — API Django + PostgreSQL.
#
# Deploiement : render.com > New > Blueprint > choisir ce depot. Render lit ce
# fichier, cree la base et le service, et redeploie a chaque push sur main.
#
# Les valeurs marquees `sync: false` ne sont PAS dans le depot : Render les
# demande au premier deploiement et les garde dans son magasin de secrets.

databases:
  - name: taskforce-db
    databaseName: taskforce
    user: taskforce
    # Plan gratuit : la base est supprimee au bout de 30 jours. Passer en
    # "basic-256mb" (7 $/mois) avant la mise en service reelle.
    plan: free

services:
  - type: web
    name: taskforce-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main
    # Le conteneur applique les migrations au demarrage puis lance gunicorn ;
    # /healthz/ verifie aussi la base, donc un deploiement casse est detecte.
    healthCheckPath: /healthz/
    envVars:
      - key: DEBUG
        value: 'False'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taskforce-db
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: taskforce-api
          property: host
      # Render termine le TLS en amont : laisser True provoque une boucle de
      # redirection.
      - key: SECURE_SSL_REDIRECT
        value: 'False'
      - key: FRONTEND_URL
        value: https://taskforce.bofigauthier3.workers.dev
      - key: CORS_ALLOWED_ORIGINS
        value: https://taskforce.bofigauthier3.workers.dev
      - key: CSRF_TRUSTED_ORIGINS
        value: https://taskforce.bofigauthier3.workers.dev
      # Doit valoir https://<host de ce service> — a coller apres le premier
      # deploiement, quand l'URL est connue.
      - key: SOCIAL_AUTH_REDIRECT_BASE
        sync: false
      # Stockage objet : sans lui, toute image/video televersee disparait au
      # redeploiement (systeme de fichiers ephemere). Cloudflare R2 convient.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: '587'
      - key: EMAIL_USE_TLS
        value: 'True'
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
