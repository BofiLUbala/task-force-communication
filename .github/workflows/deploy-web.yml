# Web App -> Cloudflare Workers (ex-Cloudflare Pages).
#
# Se declenche a chaque push sur main touchant web-app/. Le build est fait ici
# (VITE_API_URL est inline a la compilation : changer l'API impose un rebuild,
# pas un simple redemarrage), puis wrangler.jsonc publie web-app/dist.
# wrangler.jsonc ne doit JAMAIS pointer sur les sources : tout ce que contient
# le dossier "assets" devient public.
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   CLOUDFLARE_API_TOKEN   token avec la permission "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID  75a7ce7f558c33f20edfd67b0c041f92
#   VITE_API_URL           ex. https://api.exemple.cd/api

name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'web-app/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Le secret VITE_API_URL est absent : le build pointerait vers localhost."
            exit 1
          fi
          npm run build

      - name: Publier sur Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Depuis la racine du depot : c'est la que se trouve wrangler.jsonc.
          workingDirectory: .
          command: deploy
